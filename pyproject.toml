[project]
name = "jira-github-code-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "langgraph",
  "langchain",
  "langchain-openai",
  "requests",
  "python-dotenv",
  "pydantic",
]

[project.scripts]
jira-github-agent = "jira_github_agent.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
